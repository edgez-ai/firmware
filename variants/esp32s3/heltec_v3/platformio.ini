[env:heltec-v3] 
extends = esp32s3_base
board = heltec_wifi_lora_32_V3
board_level = pr
board_check = true
board_build.partitions = partitions.csv
lib_extra_dirs = ../wakaama
lib_deps = 
  ${esp32s3_base.lib_deps}
  Wakaama
build_src_filter = 
  ${esp32s3_base.build_src_filter}
build_flags = 
  ${esp32s3_base.build_flags}
  -D HELTEC_V3
  -I variants/esp32s3/heltec_v3
  ; Wakaama library includes and tinydtls third-party headers (some redundant once library is detected, harmless)
  -I ../wakaama/examples/shared/tinydtls
  -I ../wakaama/examples/shared/tinydtls/aes
  -I ../wakaama/examples/shared/tinydtls/ssh2
  -I ../wakaama/examples/shared/tinydtls/ecc
  -I ../wakaama/examples/client/common
  -I ../wakaama/examples/shared
  -I ../wakaama/include
  -I ../wakaama/examples/shared
  -I ../wakaama/coap
  -I ../wakaama/core  
  -D GPS_POWER_TOGGLE ; comment this line to disable triple press function on the user button to turn off gps entirely.
  ; LwM2M Client configuration (TinyDTLS and other flags are handled by Wakaama library)
  -D LWM2M_CLIENT_MODE
  -D WITH_TINYDTLS
  -D LWM2M_COAP_DEFAULT_BLOCK_SIZE=512
  -D LWM2M_COAP_MAX_MESSAGE_SIZE=2048
  -D LWM2M_COAP_DEFAULT_MAX_RETRANSMIT=4
  -D LWM2M_COAP_SEPARATE_TIMEOUT=15
  -D LWM2M_SUPPORT_TLV
  -D LWM2M_BOOTSTRAP
  -D LWM2M_SUPPORT_JSON
  -D LWM2M_SUPPORT_SENML_JSON
  -D WITH_SHA256
  -D WITH_ECC
  -D LWM2M_LITTLE_ENDIAN
  -D ESPIDF_VERSION
  -D WITH_LWIP
  -D SHA2_USE_INTTYPES_H
  -D DTLS_CHECK_CONTENTTYPE
  ; Optional: Override Wakaama library defaults if needed
  ; -D LWM2M_LOG_LEVEL=LWM2M_LOG_INFO
